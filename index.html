<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <dl class="countdown">
        <div class="item">
            <dt class="days-text">Days</dt>
            <dd class="days">00</dd>
        </div>
        <div class="item">
            <dt class="hours-text">Hours</dt>
            <dd class="hours">00</dd>
        </div>
        <div class="item">
            <dt class="minutes-text">Minutes</dt>
            <dd class="minutes">00</dd>
        </div>
        <div class="item">
            <dt class="seconds-text">Seconds</dt>
            <dd class="seconds">00</dd>
        </div>
    </dl>

    <script src="script.js"></script>
</body>

</html>
